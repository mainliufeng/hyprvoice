# Legacy hyprlang configuration; do not load alongside the Lua bindings.
bind = , F8, exec, hyprvoice press
bindr = , F8, exec, hyprvoice release
bind = , F9, exec, hyprvoice command
bindr = , F9, exec, hyprvoice stop
bind = SUPER ALT, Return, exec, hyprvoice commit
bind = SUPER ALT, O, exec, hyprvoice raw
bind = SUPER ALT, Escape, exec, hyprvoice cancel
bind = SUPER ALT, 1, exec, hyprvoice scene raw
bind = SUPER ALT, 2, exec, hyprvoice scene correct
bind = SUPER ALT, 3, exec, hyprvoice scene format
bind = SUPER ALT, 4, exec, hyprvoice scene translate
