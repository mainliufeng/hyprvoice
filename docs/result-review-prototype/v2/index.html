<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyprVoice · 细读与校对 / 第二版</title><link rel="stylesheet" href="style.css?v=02-compact-final"></head>
<body><main>
<header class="studio-header"><div><p class="eyebrow">HYPRVOICE / REVIEW STUDY 02</p><h1>让文字安静，让差异清楚。</h1></div><span class="prototype-label">可点击设计原型 · 待评审</span></header>
<div class="studio-toolbar"><nav class="theme-tabs" aria-label="视觉方案"><button data-theme="compare">方案对照</button><button data-theme="indigo">A · 雾白靛蓝</button><button data-theme="sage">B · 暖纸松绿</button></nav><button class="reset" id="reset">重置演示</button></div>
<nav class="state-tabs" aria-label="体验状态"><button data-state="read"><span>01</span>默认阅读</button><button data-state="asr"><span>02</span>识别校对</button><button data-state="edit"><span>03</span>整段编辑</button><button data-state="error"><span>04</span>中断恢复</button><button data-state="voice"><span>05</span>语音修改</button></nav>
